name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey-backend
  FASTAPI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey-chatbot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────── Docker ────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: fastapi
          push: true
          tags: |
            ${{ env.FASTAPI_IMAGE }}:latest
            ${{ env.FASTAPI_IMAGE }}:${{ github.sha }}

      # ──────────── Deploy ────────────
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey-backend
          FASTAPI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey-chatbot
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.CORS_ALLOWED_ORIGIN_PATTERNS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: FRONTEND_IMAGE,BACKEND_IMAGE,FASTAPI_IMAGE,GEMINI_API_KEY,JWT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_REDIRECT_URI,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,MAIL_USERNAME,MAIL_PASSWORD,FRONTEND_URL,CORS_ALLOWED_ORIGIN_PATTERNS
          script: |
            # Docker 네트워크 (frontend ↔ backend ↔ chatbot 통신용)
            docker network create matey-network 2>/dev/null || true

            # 최신 이미지 Pull
            docker pull "$FASTAPI_IMAGE:latest"
            docker pull "$BACKEND_IMAGE:latest"
            docker pull "$FRONTEND_IMAGE:latest"

            # ── (마이그레이션) 예전 backend 컨테이너명 'matey' 정리 ──
            # backend 이미지/컨테이너가 matey → matey-backend 로 바뀌어,
            # 8080 을 점유하던 옛 컨테이너를 먼저 제거한다.
            docker stop matey 2>/dev/null || true
            docker rm   matey 2>/dev/null || true

            # ── FastAPI (matey-chatbot) ──
            docker stop matey-chatbot 2>/dev/null || true
            docker rm   matey-chatbot 2>/dev/null || true
            docker run -d \
              --name matey-chatbot \
              --network matey-network \
              --restart unless-stopped \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              "$FASTAPI_IMAGE:latest"

            # ── Backend (matey-backend) ──
            docker stop matey-backend 2>/dev/null || true
            docker rm   matey-backend 2>/dev/null || true
            docker run -d \
              --name matey-backend \
              --network matey-network \
              --restart unless-stopped \
              -p 8080:8080 \
              -e JWT_SECRET="$JWT_SECRET" \
              -e NAVER_CLIENT_ID="$NAVER_CLIENT_ID" \
              -e NAVER_CLIENT_SECRET="$NAVER_CLIENT_SECRET" \
              -e NAVER_REDIRECT_URI="$NAVER_REDIRECT_URI" \
              -e KAKAO_CLIENT_ID="$KAKAO_CLIENT_ID" \
              -e KAKAO_CLIENT_SECRET="$KAKAO_CLIENT_SECRET" \
              -e KAKAO_REDIRECT_URI="$KAKAO_REDIRECT_URI" \
              -e MAIL_USERNAME="$MAIL_USERNAME" \
              -e MAIL_PASSWORD="$MAIL_PASSWORD" \
              -e FRONTEND_URL="$FRONTEND_URL" \
              -e CORS_ALLOWED_ORIGIN_PATTERNS="$CORS_ALLOWED_ORIGIN_PATTERNS" \
              "$BACKEND_IMAGE:latest"

            # ── Frontend (matey) ──
            docker stop matey-frontend 2>/dev/null || true
            docker rm   matey-frontend 2>/dev/null || true
            docker run -d \
              --name matey-frontend \
              --network matey-network \
              --restart unless-stopped \
              -p 80:80 \
              "$FRONTEND_IMAGE:latest"

            # 사용하지 않는 이미지 정리
            docker image prune -f
