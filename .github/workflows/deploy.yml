name: Deploy to EC2

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey
  FASTAPI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey-chatbot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ──────────── Frontend ────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend build to backend static resources
        run: |
          rm -rf backend/src/main/resources/static
          cp -r frontend/build/. backend/src/main/resources/static

      # ──────────── Docker ────────────
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push FastAPI image
        uses: docker/build-push-action@v5
        with:
          context: fastapi
          push: true
          tags: |
            ${{ env.FASTAPI_IMAGE }}:latest
            ${{ env.FASTAPI_IMAGE }}:${{ github.sha }}

      # ──────────── Deploy ────────────
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1
        env:
          BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey
          FASTAPI_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/matey-chatbot
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          NAVER_REDIRECT_URI: ${{ secrets.NAVER_REDIRECT_URI }}
          KAKAO_CLIENT_ID: ${{ secrets.KAKAO_CLIENT_ID }}
          KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
          KAKAO_REDIRECT_URI: ${{ secrets.KAKAO_REDIRECT_URI }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          FRONTEND_URL: ${{ secrets.FRONTEND_URL }}
          CORS_ALLOWED_ORIGIN_PATTERNS: ${{ secrets.CORS_ALLOWED_ORIGIN_PATTERNS }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: BACKEND_IMAGE,FASTAPI_IMAGE,GEMINI_API_KEY,JWT_SECRET,NAVER_CLIENT_ID,NAVER_CLIENT_SECRET,NAVER_REDIRECT_URI,KAKAO_CLIENT_ID,KAKAO_CLIENT_SECRET,KAKAO_REDIRECT_URI,MAIL_USERNAME,MAIL_PASSWORD,FRONTEND_URL,CORS_ALLOWED_ORIGIN_PATTERNS
          script: |
            # Docker 네트워크 (backend ↔ chatbot 통신용)
            docker network create matey-network 2>/dev/null || true

            # 최신 이미지 Pull
            docker pull "$FASTAPI_IMAGE:latest"
            docker pull "$BACKEND_IMAGE:latest"

            # ── FastAPI (matey-chatbot) ──
            docker stop matey-chatbot 2>/dev/null || true
            docker rm   matey-chatbot 2>/dev/null || true
            docker run -d \
              --name matey-chatbot \
              --network matey-network \
              --restart unless-stopped \
              -e GEMINI_API_KEY="$GEMINI_API_KEY" \
              "$FASTAPI_IMAGE:latest"

            # ── Backend (matey) ──
            docker stop matey 2>/dev/null || true
            docker rm   matey 2>/dev/null || true
            docker run -d \
              --name matey \
              --network matey-network \
              --restart unless-stopped \
              -p 8080:8080 \
              -e JWT_SECRET="$JWT_SECRET" \
              -e NAVER_CLIENT_ID="$NAVER_CLIENT_ID" \
              -e NAVER_CLIENT_SECRET="$NAVER_CLIENT_SECRET" \
              -e NAVER_REDIRECT_URI="$NAVER_REDIRECT_URI" \
              -e KAKAO_CLIENT_ID="$KAKAO_CLIENT_ID" \
              -e KAKAO_CLIENT_SECRET="$KAKAO_CLIENT_SECRET" \
              -e KAKAO_REDIRECT_URI="$KAKAO_REDIRECT_URI" \
              -e MAIL_USERNAME="$MAIL_USERNAME" \
              -e MAIL_PASSWORD="$MAIL_PASSWORD" \
              -e FRONTEND_URL="$FRONTEND_URL" \
              -e CORS_ALLOWED_ORIGIN_PATTERNS="$CORS_ALLOWED_ORIGIN_PATTERNS" \
              "$BACKEND_IMAGE:latest"

            # 사용하지 않는 이미지 정리
            docker image prune -f
