server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내부 DNS. 변수로 두어 backend 컨테이너가 재배포돼 IP가 바뀌어도
    # nginx 재시작 없이 따라가도록 한다 (정적 upstream 은 시작 시 1회만 해석됨).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # 운영에서는 Spring(matey-backend)이 /api 를 받아 FastAPI(matey-chatbot)로
    # 직접 프록시하므로, nginx 는 /api 전체를 backend 로만 넘기면 된다.
    location /api/ {
        set $backend http://matey-backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;            # AI 채팅 스트리밍(SSE) 대응
        proxy_read_timeout 300s;
    }

    location /oauth2/ {
        set $oauth_backend http://matey-backend:8080;
        proxy_pass $oauth_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 클라이언트 라우팅 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
