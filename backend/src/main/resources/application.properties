spring.application.name=matey

mybatis.configuration.map-underscore-to-camel-case=true

# ===============================
# Swagger (API 문서 자동화) 설정
# ===============================

# Swagger UI 접속 경로:  http://localhost:8080/swagger-ui.html 로 접속 가능
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI에서 API 정렬 기준 (HTTP Method 기준 정렬)
# ex) GET → POST → PUT → DELETE
springdoc.swagger-ui.operations-sorter=method

# 태그 이름을 알파벳 순으로 정렬
springdoc.swagger-ui.tags-sorter=alpha

# Swagger가 스캔할 Controller 패키지 지정
# 이 경로 안에 있는 @RestController 들만 문서화됨
springdoc.packages-to-scan=kr.hi.matey.controller

# ===============================
# 데이터베이스(MySQL) 연결 설정
# ===============================

spring.datasource.username=root
spring.datasource.password=root
# MySQL JDBC 드라이버 클래스
# MySQL 8 이상에서는 반드시 com.mysql.cj.jdbc.Driver 사용
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/matey?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true
# JWT 설정
# 1. Secret Key: 보안을 위해 무작위의 긴 문자열을 입력
jwt.secret=vms70m19024m30m503m1023m102m305m1023m105m1023m102m305m1023m

# 2. Access Token 만료 시간: 1,800초 (30분)
jwt.token-validity-in-seconds=1800

# (선택) Refresh Token을 사용한다면 추가 설정: 604,800초 (7일)
jwt.refresh-token-validity-in-seconds=604800