spring.application.name=matey

mybatis.configuration.map-underscore-to-camel-case=true

# ===============================
# Swagger (API 문서 자동화) 설정
# ===============================

# Swagger UI 접속 경로:  http://localhost:8080/swagger-ui.html 로 접속 가능
springdoc.swagger-ui.path=/swagger-ui.html

# Swagger UI에서 API 정렬 기준 (HTTP Method 기준 정렬)
# ex) GET → POST → PUT → DELETE
springdoc.swagger-ui.operations-sorter=method

# 태그 이름을 알파벳 순으로 정렬
springdoc.swagger-ui.tags-sorter=alpha

# Swagger가 스캔할 Controller 패키지 지정
# 이 경로 안에 있는 @RestController 들만 문서화됨
springdoc.packages-to-scan=kr.hi.matey.controller

# ===============================
# 데이터베이스(MySQL) 연결 설정
# ===============================

spring.datasource.username=root
spring.datasource.password=root
# MySQL JDBC 드라이버 클래스
# MySQL 8 이상에서는 반드시 com.mysql.cj.jdbc.Driver 사용
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.jdbc-url=jdbc:mysql://localhost:3306/matey?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true

app.frontend-url=${FRONTEND_URL:http://localhost:3000}

oauth.providers.naver.client-id=${NAVER_CLIENT_ID}
oauth.providers.naver.client-secret=${NAVER_CLIENT_SECRET}
# redirect-uri : 추후 수정할 것
oauth.providers.naver.redirect-uri=${NAVER_REDIRECT_URI:http://localhost:8080/oauth2/callback/naver}
oauth.providers.naver.authorize-uri=https://nid.naver.com/oauth2.0/authorize
oauth.providers.naver.token-uri=https://nid.naver.com/oauth2.0/token
oauth.providers.naver.user-info-uri=https://openapi.naver.com/v1/nid/me

oauth.providers.kakao.client-id=${KAKAO_CLIENT_ID}
oauth.providers.kakao.client-secret=${KAKAO_CLIENT_SECRET:}
# redirect-uri : 추후 수정할 것
oauth.providers.kakao.redirect-uri=${KAKAO_REDIRECT_URI:http://localhost:8080/oauth2/callback/kakao}
oauth.providers.kakao.authorize-uri=https://kauth.kakao.com/oauth/authorize
oauth.providers.kakao.token-uri=https://kauth.kakao.com/oauth/token
oauth.providers.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me

social.success-path=/social/success
