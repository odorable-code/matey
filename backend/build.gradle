plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.12-SNAPSHOT'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'kr.hi'
version = '0.0.1-SNAPSHOT'
description = 'Demo project for Spring Boot'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21) 
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url = 'https://repo.spring.io/snapshot' }
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.16'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	
	// 위가 기본 dependencies 속성, 여기서부터 팀에서 추가한 dependencies
	// MySQL Connector
    implementation 'mysql:mysql-connector-java:8.0.16'
    // MyBatis Spring Boot Starter
    implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:3.0.4'
    // Spring Boot Starter JDBC
    //implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    // Spring Boot Configuration Processor (Annotation Processor)
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
     // Spring Security (암호화 도구 포함)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    // 타임리프를 이용하여 sec:를 사용하기 위해 추가
    implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
    // jwt 의존성 추가
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JSON 파싱용
	// WebClient 사용을 위해 추가
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	// 자바 애플리케이션에서 이메일을 발송하는 데 필요한 모든 도구(JavaMailSender, SimpleMailMessage 등)를 한데 모아 바로 쓸 수 있게 해주는 라이브러리
	implementation 'org.springframework.boot:spring-boot-starter-mail'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
	options.compilerArgs.add('-parameters')
}
